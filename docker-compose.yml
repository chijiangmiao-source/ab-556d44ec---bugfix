services:
  app:
    build: ./app
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 2s

  verify:
    build:
      context: .
      dockerfile: verify/Dockerfile
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_URL: http://app:8000
